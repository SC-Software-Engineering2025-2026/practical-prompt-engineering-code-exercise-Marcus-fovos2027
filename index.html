<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prompt Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Prompt Library</h1>
        <p class="sub">Save, view and delete your prompts locally.</p>
      </header>

      <section class="editor">
        <label class="field">
          <span>Title</span>
          <input
            id="title"
            type="text"
            placeholder="Enter a title"
            maxlength="100"
          />
        </label>

        <label class="field">
          <span>Prompt</span>
          <textarea
            id="prompt"
            rows="6"
            placeholder="Write or paste your prompt here"
          ></textarea>
        </label>

        <div class="actions">
          <button id="saveBtn" class="btn primary">Save Prompt</button>
          <button id="clearBtn" class="btn ghost">Clear</button>
        </div>
      </section>

      <section class="library">
        <h2>Saved Prompts</h2>
        <div id="promptsList" class="list"></div>
        <p id="empty" class="empty">No saved prompts yet.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
